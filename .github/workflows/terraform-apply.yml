name: terraform-apply

on:
    push:
        branches: [main]
        paths:
            - "terraform/**"
            - ".github/workflows/terraform-apply.yml"
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to apply"
                required: true
                default: "dev"
                type: choice
                options: [dev, prod]

permissions:
    id-token: write
    contents: read

concurrency:
    # Shared with terraform-destroy so apply and destroy serialize against each other.
    group: tf-state-dev
    cancel-in-progress: false # never cancel an apply mid-flight

env:
    TF_VERSION: "1.15.8"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    ARM_USE_OIDC: "true"
    ARM_USE_AZUREAD: "true"
    ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
    apply:
        name: apply (${{ matrix.environment }})
        runs-on: ubuntu-latest
        # Binds to GitHub environment -> required reviewer gate for prod (already configured)
        environment: ${{ matrix.environment }}
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                environment:
                    - ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}
                  terraform_wrapper: false

            - name: Terraform init
              run: terraform init -input=false

            - name: Terraform plan
              run: |
                  terraform plan \
                    -input=false \
                    -no-color \
                    -var-file="../environments/team-beta/${{ matrix.environment }}.tfvars" \
                    -out=tfplan

            - name: Terraform apply
              run: terraform apply -input=false -no-color tfplan

            - name: Show outputs
              run: terraform output -no-color
